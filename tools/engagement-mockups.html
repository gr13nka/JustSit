<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JustSit — engagement mockups</title>
<!--
  Seven phone-framed mockups of proposed engagement features, drawn in the
  app's own hand. Open it straight off disk — no server, no build step,
  nothing outside this file (the anim-lab.html precedent).

  It is a COPY, and knowingly so: the palette is themes.ts's Ink theme, the
  plants are Plant.tsx's SPECIES paths, the icons are icons.paths.ts's traced
  outlines, the cat is Baton.tsx, the ring is ring.ts ported line for line.
  Pasted in rather than imported, because importing TypeScript into a file://
  page means a build step, and a build step is the thing that would let this
  rot. If a drawing changes in the app, re-paste it here.

  Everything on this page is a PROPOSAL. Nothing ships from here.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Shantell+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  /* ── The Ink palette, verbatim from src/theme/themes.ts ─────────────── */
  :root {
    --paper: #F7F3E9;        /* paper */
    --paper-deep: #EFE9DA;   /* paperDeep */
    --ink: #26241F;          /* ink */
    --ink-soft: #6B665C;     /* inkSoft */
    --ink-faint: #A9A294;    /* inkFaint */
    --accent: #26241F;       /* accent — ink, in the Ink theme */
    --pen-green: #2E7D46;    /* penGreen */
    --pen-blue: #2F3AC7;     /* penBlue */
    --pen-orange: #E07A1F;   /* penOrange */
    --pen-pink: #D9569B;     /* penPink */

    --sans: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --hand: 'Shantell Sans', 'Segoe Print', 'Comic Sans MS', cursive;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    padding: 48px 24px 64px;
  }

  /* ── Type scale, from src/theme/typography.ts ───────────────────────── */
  .t-label    { font: 500 13px/17px var(--sans); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); }
  .t-title    { font: 700 18px/23px var(--sans); color: var(--ink); }
  .t-timer    { font: 400 56px/1 var(--sans); color: var(--ink); }
  .t-body     { font: 500 15px/23px var(--sans); color: var(--ink); }
  .t-caption  { font: 500 13px/18px var(--sans); color: var(--ink-soft); }
  .t-button   { font: 700 15px/1 var(--sans); letter-spacing: 0.2px; }
  .t-teaching { font: 400 18px/28px var(--sans); color: var(--ink); }
  .t-hand     { font: 400 18px/25px var(--hand); color: var(--ink); }

  /* ── Page chrome (outside the phones): same paper, hairlines only ───── */
  .page-head { max-width: 900px; margin: 0 auto 12px; text-align: center; }
  .brand { font: 400 15px/1 var(--hand); letter-spacing: 3px; color: var(--ink-soft); }
  .page-head h1 { font: 700 24px/32px var(--sans); margin-top: 12px; }
  .page-head .note { font: 500 14px/22px var(--sans); color: var(--ink-soft); margin-top: 8px; }
  .page-rule { display: block; margin: 24px auto 40px; }

  .frames {
    display: flex;
    flex-wrap: wrap;
    gap: 48px 40px;
    justify-content: center;
    align-items: flex-start;
    max-width: 1360px;
    margin: 0 auto;
  }

  figure.mock { width: 393px; }

  /* Each phone: hairline ink border, paper ground, corners that disagree —
     organicCorners' character, four unequal single-axis radii. */
  .phone {
    position: relative;
    width: 393px;
    height: 852px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 26px 21px 25px 22px;
    overflow: hidden;
  }
  /* The app hides the status bar; the notch inset stays as empty paper. */
  .phone .inset-top { height: 46px; }

  figcaption { margin-top: 14px; padding: 0 4px; }
  figcaption .cap-num { font: 400 17px/1 var(--hand); color: var(--ink); margin-right: 6px; }
  figcaption .cap-title { font: 700 15px/22px var(--sans); color: var(--ink); }
  figcaption p { font: 500 13.5px/20px var(--sans); color: var(--ink-soft); margin-top: 4px; }

  /* ── Shared app chrome inside frames ────────────────────────────────── */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 46px 24px 24px;  /* top inset · space.lg sides · bottom inset */
  }

  .figures {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 4px;
  }
  .indicator { display: flex; align-items: center; gap: 6px; }

  .garden-head { text-align: center; padding: 8px 0 16px; }
  .garden-head .t-caption { letter-spacing: 0.5px; margin-top: 4px; }

  /* Buttons. Primary = accent fill + organicCorners(12); at most one per
     screen. Wobbly is Meditate's alone and never appears here. */
  .btn-primary {
    display: block;
    background: var(--accent);
    color: var(--paper);
    text-align: center;
    padding: 16px 32px;
    border-radius: 13.4px 10.3px 12.2px 11.1px;
  }
  .btn-quiet {
    display: block;
    color: var(--ink-soft);
    text-align: center;
    padding: 16px 32px;
  }

  .footer { margin-top: auto; padding-bottom: 24px; }

  /* The floating screen switcher: paperDeep bar, one accent marker. */
  .nav-dock {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    padding-bottom: 32px;  /* insets.bottom 24 + space.sm 8 */
    pointer-events: none;
  }
  .nav-bar {
    position: relative;
    display: flex;
    gap: 2px;
    padding: 6px;
    background: var(--paper-deep);
    border-radius: 14.9px 11.2px 13.6px 12.4px; /* organicCorners(13) */
  }
  .nav-item {
    position: relative;
    z-index: 1;
    width: 52px; height: 42px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-marker {
    position: absolute;
    left: 6px; top: 6px;
    width: 52px; height: 42px;
    background: var(--accent);
    border-radius: 10.6px 7.4px 9.9px 8.1px; /* organicCorners(9), pushed */
  }

  /* ── The two sanctioned loops ───────────────────────────────────────── */
  /* One breath: 6s out to (0.5 opacity, 0.96 scale), 4s back — TimerRing. */
  @keyframes breathe {
    0%   { opacity: 1;   transform: scale(1); }
    60%  { opacity: 0.5; transform: scale(0.96); }
    100% { opacity: 1;   transform: scale(1); }
  }
  .breathing {
    animation: breathe 10s ease-in-out infinite;
    transform-origin: center;
  }
  /* The next-dot ring's invitation pulse: scale ~1.08, opacity ~0.7,
     the same 4s-in / 6s-out breath count. One marker per screen. */
  @keyframes invite {
    0%   { opacity: 1;   transform: scale(1); }
    40%  { opacity: 0.7; transform: scale(1.08); }
    100% { opacity: 1;   transform: scale(1); }
  }
  .inviting { animation: invite 10s ease-in-out infinite; transform-origin: center; }

  /* ── Frame-specific ─────────────────────────────────────────────────── */
  .onb-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .bed-preview { display: flex; align-items: flex-end; justify-content: center; gap: 20px; margin-top: 36px; }
  .bed-dots { display: flex; gap: 6px; margin-bottom: 16px; }
  .bed-line { text-align: center; margin-top: 4px; }

  .field-zone { position: relative; flex: 1; }

  .patch-scene { display: flex; align-items: flex-end; justify-content: center; gap: 24px; margin-top: 140px; }
  .patch-dots { display: flex; gap: 5px; margin-bottom: 20px; }
  .patch-dots .slot { position: relative; width: 25px; height: 25px; }
  .patch-dots .slot svg { position: absolute; inset: 0; }

  .grid { position: relative; margin: 0 auto; }
  .grid .cell-mark { position: absolute; }
  .grid svg { display: block; }

  .baton-below { display: flex; justify-content: center; margin-top: 18px; }

  .choose-middle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
  .choose-title { font: 700 26px/33px var(--sans); color: var(--ink); }
  .trio { display: flex; align-items: flex-end; gap: 24px; }
  .candidate { position: relative; width: 98px; height: 102px; display: flex; align-items: flex-end; justify-content: center; }
  .candidate .marker {
    position: absolute; inset: 0;
    background: var(--paper-deep);
    border-radius: 14.6px 11.1px 13.2px 12.3px; /* organicCorners(12ish) */
  }
  .candidate svg { position: relative; }
  .candidate.chosen svg { transform: scale(1.06); transform-origin: 50% 90%; }

  .run-middle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ringbox { position: relative; width: 210px; height: 210px; display: flex; align-items: center; justify-content: center; }
  .ringbox svg.layer { position: absolute; inset: 0; }
  .clock { margin-top: 32px; text-align: center; }
  .clock .unit { letter-spacing: 1px; margin-top: 4px; }
  .pencil-corner { position: absolute; right: 24px; bottom: 36px; }

  .veil { position: absolute; inset: 0; background: var(--paper); opacity: 0.55; }
  .thought-card {
    position: absolute;
    left: 16px; right: 16px; bottom: 16px;
    background: var(--paper-deep);
    border-radius: 22px 17.4px 21.2px 18.6px; /* organicCorners(20) */
    padding: 24px;
  }
  .thought-input {
    font: 500 15px/23px var(--sans);
    color: var(--ink-faint);
    border-bottom: 1.5px solid var(--ink-faint);
    padding-bottom: 8px;
  }
  .thought-done { text-align: right; margin-top: 16px; color: var(--ink-soft); }

  .notes-head { position: relative; display: flex; align-items: center; justify-content: center; height: 32px; margin-bottom: 16px; }
  .notes-head .back { position: absolute; left: 0; top: 4px; }
  .masonry { columns: 2; column-gap: 12px; }
  .note-card {
    break-inside: avoid;
    background: var(--paper-deep);
    padding: 14px;
    margin-bottom: 12px;
  }
  .note-card p { font: 500 14px/21px var(--sans); color: var(--ink); }
  .note-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .note-meta .date { font: 500 12px/16px var(--sans); color: var(--ink-faint); }
</style>
</head>
<body>

<header class="page-head">
  <div class="brand">JUST SIT</div>
  <h1>Engagement redesign — screen mockups</h1>
  <p class="note">Seven proposed screens, drawn with the app's own paths and palette. Nothing here is built; each stands or falls on its own.</p>
  <svg class="page-rule" width="48" height="6" viewBox="0 0 48 6"><path d="M1 3.5 C4.8 3.5 8.7 1.9 12.5 1.9 C16.3 1.9 20.2 3.9 24 3.9 C27.8 3.9 31.7 2.4 35.5 2.4 C39.3 2.4 43.2 4 47 4" stroke="var(--ink-faint)" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
</header>

<main class="frames">

  <!-- ① Onboarding, last step: meeting the bed (F8) -->
  <figure class="mock">
    <div class="phone">
      <div class="screen">
        <div class="onb-body">
          <div class="t-label">Stage 1 · Directed Attention</div>
          <div class="t-caption" style="margin-top:4px">Mindfulness of breathing</div>
          <svg width="48" height="6" viewBox="0 0 48 6" style="margin:24px 0"><path d="M1 3.5 C4.8 3.5 8.7 1.9 12.5 1.9 C16.3 1.9 20.2 3.9 24 3.9 C27.8 3.9 31.7 2.4 35.5 2.4 C39.3 2.4 43.2 4 47 4" stroke="var(--ink-faint)" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
          <div class="t-teaching">You can place your attention on the breath on purpose, even if it slips away after a few seconds.</div>
          <div class="t-caption" style="margin-top:32px">There are ten stages, and they are meant to take a long time. The app will suggest moving on when it seems reasonable to ask — you decide.</div>

          <div class="bed-preview">
            <div class="bed-dots" id="bed-dots-1"></div>
            <span id="baton-1"></span>
          </div>
          <div class="bed-line t-hand" style="color:var(--ink-soft); font-size:16px">Each sitting grows something here.</div>
        </div>
        <div class="footer">
          <div class="btn-primary t-button">Start where you are</div>
        </div>
      </div>
    </div>
    <figcaption>
      <span class="cap-num">1</span><span class="cap-title">Meeting the bed — onboarding's last step (F8)</span>
      <p>The stage-one step as it is, plus a preview of the starting bed: three dots and the cat, so the first sitting has somewhere to land before it is asked for. One felt line carries the mechanic. The question to judge: does the bed belong here, or is stage one already enough for one screen?</p>
    </figcaption>
  </figure>

  <!-- ② The early garden: three dots (F2) -->
  <figure class="mock">
    <div class="phone">
      <div class="screen" style="padding-bottom:0">
        <div class="figures">
          <div class="indicator"><span id="ico-sun-2"></span><span class="t-title">0</span></div>
          <div class="indicator"><span id="ico-leaf-2"></span><span class="t-title">0</span></div>
        </div>
        <div class="garden-head">
          <div class="t-title">Your garden</div>
          <div class="t-caption">A small bed · 0 of 3</div>
        </div>
        <div class="field-zone">
          <div class="patch-scene">
            <div class="patch-dots" id="patch-2"></div>
            <span id="baton-2"></span>
          </div>
        </div>
        <div class="nav-dock">
          <div class="nav-bar">
            <div class="nav-marker"></div>
            <div class="nav-item" id="nav-garden-2"></div>
            <div class="nav-item" id="nav-you-2"></div>
          </div>
        </div>
      </div>
    </div>
    <figcaption>
      <span class="cap-num">2</span><span class="cap-title">A small bed — the garden at zero (F2)</span>
      <p>The garden opens at three dots instead of a 108-slot plot, and the next dot breathes — the one pulsing mark on the screen. Батон keeps the empty bed company, as he already does. The caption's wording ("A small bed · 0 of 3") is open: it has to promise little without hiding that the field will grow.</p>
    </figcaption>
  </figure>

  <!-- ③ The garden mid-game (F2+F3+F4) -->
  <figure class="mock">
    <div class="phone">
      <div class="screen" style="padding-bottom:0">
        <div class="figures">
          <div class="indicator"><span id="ico-sun-3"></span><span class="t-title" style="color:var(--pen-green)">6</span></div>
          <div class="indicator"><span id="ico-leaf-3"></span><span class="t-title" style="color:var(--pen-green)">15</span></div>
        </div>
        <div class="garden-head">
          <div class="t-title">Your garden</div>
          <div class="t-caption">Plot 1 · 15 of 108</div>
        </div>
        <div class="field-zone">
          <div class="grid" id="grid-3"></div>
          <div class="baton-below" id="baton-3"></div>
        </div>
        <div class="nav-dock">
          <div class="nav-bar">
            <div class="nav-marker"></div>
            <div class="nav-item" id="nav-garden-3"></div>
            <div class="nav-item" id="nav-you-3"></div>
          </div>
        </div>
      </div>
    </div>
    <figcaption>
      <span class="cap-num">3</span><span class="cap-title">The daily loop, visible (F2 + F3 + F4)</span>
      <p>At ~15 sittings the field has revealed three of its nine rows; the ring waits on the next dot. A green sun means you sat today, and Батон naps by the garden on sat-days — on other days he is simply elsewhere, never a reproach. Every seventh consecutive day quietly guarantees a rare candidate in the completion trio; nothing announces this anywhere.</p>
    </figcaption>
  </figure>

  <!-- ④ Completion: something grew, choose (F1) -->
  <figure class="mock">
    <div class="phone">
      <div class="screen">
        <div class="choose-middle">
          <div class="choose-title">Something grew.</div>
          <div class="trio">
            <div class="candidate" id="cand-clover"></div>
            <div class="candidate chosen" id="cand-fern"></div>
            <div class="candidate" id="cand-poppy"></div>
          </div>
          <div class="t-body" style="color:var(--ink-soft)">It takes the dot you chose.</div>
        </div>
        <div class="footer">
          <div class="btn-primary t-button">Done</div>
        </div>
      </div>
    </div>
    <figcaption>
      <span class="cap-num">4</span><span class="cap-title">Something grew — choose (F1)</span>
      <p>The sitting seeds three candidates, weighted by its length — longer sittings draw from a richer pool, and nothing is ever labelled rare in-app. Selection borrows the dial's language: a quiet paper-deep marker and a slightly fuller stance, plants keeping their own colours. The judgement call: is choosing at all worth more than the single surprise it replaces?</p>
    </figcaption>
  </figure>

  <!-- ⑤ A sitting, with the note affordance (F6) -->
  <figure class="mock">
    <div class="phone">
      <div class="screen">
        <div class="run-middle">
          <div class="ringbox" id="ring-5"></div>
          <div class="clock">
            <div class="t-timer">12</div>
            <div class="t-caption unit">min</div>
          </div>
        </div>
        <div class="footer" style="padding-bottom:24px">
          <div class="btn-quiet t-button">End</div>
        </div>
        <span class="pencil-corner" id="pencil-5"></span>
      </div>
    </div>
    <figcaption>
      <span class="cap-num">5</span><span class="cap-title">A sitting, with the note affordance (F6)</span>
      <p>The run screen exactly as it is — breathing ring, whole-minute clock, the quiet way out — plus a pencil in the corner, deliberately the quietest mark on the screen. The doodle is a code-drawn placeholder until a real one comes off the art loop. The question to judge: is even this much invitation too much during a sitting?</p>
    </figcaption>
  </figure>

  <!-- ⑥ Catching a thought (F6) -->
  <figure class="mock">
    <div class="phone">
      <div class="screen">
        <div class="run-middle">
          <div class="ringbox" id="ring-6"></div>
          <div class="clock">
            <div class="t-timer">12</div>
            <div class="t-caption unit">min</div>
          </div>
        </div>
        <div class="footer" style="padding-bottom:24px">
          <div class="btn-quiet t-button">End</div>
        </div>
      </div>
      <div class="veil"></div>
      <div class="thought-card">
        <div class="thought-input">catch it, then let it go</div>
        <div class="thought-done t-button">done</div>
      </div>
    </div>
    <figcaption>
      <span class="cap-num">6</span><span class="cap-title">Catching a thought (F6)</span>
      <p>A small card rises over the sitting; the sit continues underneath, and the clock is wall-time, so nothing is lost by pausing to write. One line, one quiet way to put it down; the note links itself to this sitting. The card is the app's own card — paper-deep, no border — risen rather than a modal.</p>
    </figcaption>
  </figure>

  <!-- ⑦ Notes (F6) -->
  <figure class="mock">
    <div class="phone">
      <div class="screen">
        <div class="notes-head">
          <span class="back" id="back-7"></span>
          <div class="t-title">Notes</div>
        </div>
        <div class="masonry" id="masonry-7"></div>
      </div>
    </div>
    <figcaption>
      <span class="cap-num">7</span><span class="cap-title">Notes (F6)</span>
      <p>Everything caught, at Keep-like density and still on paper: paper-deep cards, organic corners, no borders, no shadows. Tap a card to edit; long-press a plant in the garden to open its sitting's note. The small plant glyph is the only drawn link between a note and where it grew.</p>
    </figcaption>
  </figure>

</main>

const PEN = { penGreen: 'var(--pen-green)', penBlue: 'var(--pen-blue)', penOrange: 'var(--pen-orange)', penPink: 'var(--pen-pink)' };

/* Plant.tsx — a path that closes is a shape and takes the paper fill. */
const CLOSE_ENOUGH = 2;
const COORDINATE = /-?\d*\.?\d+/g;
function closes(subpath) {
  const n = (subpath.match(COORDINATE) || []).map(Number);
  if (n.length < 4) return false;
  return Math.hypot(n[0] - n[n.length - 2], n[1] - n[n.length - 1]) <= CLOSE_ENOUGH;
}
function isShape(d) {
  const subpaths = d.split('M').filter((run) => run.trim());
  return subpaths.length > 0 && subpaths.every(closes);
}

/* One plant, in PEN_DOODLE: stroke 2.8, round caps, shapes filled with the
   ground it stands on (paper by default — paperDeep on a marker). */
function plantSVG(key, size, ground = 'var(--paper)') {
  const { growth, bloom } = SPECIES[key];
  const marks = growth.map((d) => ({ d, pen: 'penGreen' }));
  if (bloom) for (const d of bloom.paths) marks.push({ d, pen: bloom.pen });
  const paths = marks.map(({ d, pen }) =>
    `<path d="${d}" stroke="${PEN[pen]}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="${isShape(d) ? ground : 'none'}"/>`
  ).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48">${paths}</svg>`;
}

/* src/ui/ring.ts, ported line for line: seven knots, fixed wobble table. */
const KNOT_RADIUS = [1.008, 0.978, 1.021, 0.984, 1.026, 0.974, 1.014];
const KNOT_ANGLE = [0, 0.036, -0.028, 0.02, -0.034, 0.026, -0.018];
const RING_EXTENT = Math.max(...KNOT_RADIUS);
function ringPath(cx, cy, fitRadius) {
  const n = KNOT_RADIUS.length;
  const step = (2 * Math.PI) / n;
  const angle = (i) => -Math.PI / 2 + i * step + KNOT_ANGLE[i % n];
  const radius = (i) => KNOT_RADIUS[i % n];
  const point = (i) => ({ x: Math.cos(angle(i)) * radius(i), y: Math.sin(angle(i)) * radius(i) });
  const tangent = (i) => ({ x: -Math.sin(angle(i)) * radius(i), y: Math.cos(angle(i)) * radius(i) });
  const r = fitRadius / RING_EXTENT;
  const at = (p) => `${(cx + p.x * r).toFixed(2)},${(cy + p.y * r).toFixed(2)}`;
  let d = `M${at(point(0))}`;
  for (let i = 0; i < n; i++) {
    const h = (4 / 3) * Math.tan((angle(i + 1) - angle(i)) / 4);
    const from = point(i), to = point(i + 1), tF = tangent(i), tT = tangent(i + 1);
    d += ` C${at({ x: from.x + h * tF.x, y: from.y + h * tF.y })} ${at({ x: to.x - h * tT.x, y: to.y - h * tT.y })} ${at(to)}`;
  }
  return d;
}

/* ③ — three revealed rows of the twelve-wide lattice.
   Geometry from src/ui/field.ts at the app's numbers: width 345 → cell
   floor(345/12·2)/2 = 28.5; dot = cell·ART_SHARE(0.84); plant = dot·1.85;
   ground at 0.8 of the cell; a plant's root (43/48 of its canvas) and a
   dot's centre both land on it. Scatter stays within ±SCATTER(0.08)·cell. */
(function buildField() {
  const CELL = 28.5, COLS = 12, ROWS = 3;
  const dotSize = CELL * 0.84;               // 23.94
  const plantSize = dotSize * 1.85;          // 44.29
  const ground = CELL * 0.8;                 // 22.8
  const PLANTED = [
    'grass', 'clover', 'tulip', 'sprout', 'fern', 'mushroom', 'reed', 'daisy',
    'grass', 'sapling', 'clover', 'sprout', 'berry', 'reed', 'grass',
  ];
  const JITTER = [
    [1.2, -0.8], [-1.6, 0.4], [0.4, 1.1], [-0.9, -1.3], [1.8, 0.6],
    [-0.3, -0.5], [0.9, 1.4], [-1.2, 0.2], [1.5, -1.1], [0.2, 0.8],
    [-1.8, -0.4], [0.7, -1.5], [-0.5, 1.2], [1.1, 0.3], [-1.4, -0.9],
  ];
  const NEXT = PLANTED.length;               // the ring waits on slot 15

  const above = 20;                          // the top row's overhang, paid in padding
  const grid = $('grid-3');
  grid.style.width = COLS * CELL + 'px';
  grid.style.height = above + ROWS * CELL + 6 + 'px';

  let html = '';
  for (let slot = 0; slot < COLS * ROWS; slot++) {
    const col = slot % COLS, row = Math.floor(slot / COLS);
    const cellX = col * CELL, cellY = above + row * CELL;
    if (slot < PLANTED.length) {
      const [dx, dy] = JITTER[slot];
      const left = cellX + (CELL - plantSize) / 2 + dx;
      const top = cellY + ground - (43 / 48) * plantSize + dy;
      html += `<span class="cell-mark" style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px">${plantSVG(PLANTED[slot], plantSize.toFixed(1))}</span>`;
    } else {
      const left = cellX + (CELL - dotSize) / 2;
      const top = cellY + ground - dotSize / 2;
      html += `<span class="cell-mark" style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px">${dotSVG(dotSize.toFixed(1))}</span>`;
      if (slot === NEXT) {
        html += `<span class="cell-mark" style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px">${nextRingSVG(dotSize.toFixed(1), true)}</span>`;
      }
    }
  }
  grid.innerHTML = html;
  $('baton-3').innerHTML = batonSVG(104);
})();

/* ⑤ ⑥ — the run screen's ring: elapsed arc (inkFaint, the quietest mark),
   the breathing ring (accent, one 10s breath), the preview plant at centre.
   TimerRing.tsx's numbers: size 210, hairline 1.5, arc inset 8, plant 0.28. */
function timerRing(mount, spent) {
  const SIZE = 210, HAIR = 1.5, INSET = 8;
  const c = SIZE / 2;
  const fit = (SIZE - HAIR) / 2;
  const arcR = fit - INSET;
  mount.innerHTML =
    `<svg class="layer" width="${SIZE}" height="${SIZE}"><path id="${mount.id}-arc" d="${ringPath(c, c, arcR)}" stroke="var(--ink-faint)" stroke-width="${HAIR}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
    `<svg class="layer breathing" width="${SIZE}" height="${SIZE}"><path d="${ringPath(c, c, fit)}" stroke="var(--accent)" stroke-width="${HAIR}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
    plantSVG('grass', Math.round(SIZE * 0.28));
  const arc = document.getElementById(mount.id + '-arc');
  const len = arc.getTotalLength();
  arc.setAttribute('stroke-dasharray', len);
  arc.setAttribute('stroke-dashoffset', len * (1 - spent));
}
