<!--
  A huge field of grass, in the app's hand, with the app's wind blowing over it.

  WHY THIS EXISTS.  `src/ui/sway.ts` is not a per-plant wiggle. It is three
  travelling waves — cycles 16, 11 and 7 to a turn, wavelengths 36, 52 and 82
  cells, blowing 12°, 20° and 4° off horizontal — summed and normalised. At the
  garden's twelve columns you cannot see any of that: the *shortest* wavelength
  is three times the width of the whole garden, so the field leans more or less
  together and the model has never been visible. Give it a hundred columns of
  world and you watch crests cross the field, quieten as the layers drift apart,
  and swell again, on a forty-second loop that never repeats inside itself.

  THIS IS KNOWINGLY A COPY, the `anim-lab.html` precedent. A file:// page cannot
  import TypeScript, and a build step is the thing that would let this rot. The
  drawings, the palettes, the hash and the wind are pasted below under their own
  markers; `python3 tools/lab-data.py` re-lifts the `const DATA = …;` line from
  src/ and is the way to make this current after redrawing a plant or moving a
  colour. Nothing here writes back to the repo, and nothing here ships.

  WHAT MUST MATCH THE APP EXACTLY — check these against src/ if the field ever
  looks wrong:
    · the pen: width 2.8 on the 48-unit canvas, round cap and join (src/ui/pen.ts)
    · a path that closes is a shape and takes a PAPER fill; one that does not is
      a stroke (src/ui/Plant.tsx's isShape — 23 of the 54 paths close)
    · every plant pivots on its root at y=43, not on the foot of its canvas
    · the sway's two channels are signed against each other: skew negative,
      rotation positive, because with the origin at the root the ink is at
      negative y
    · hash32 is frozen (src/domain/hash.ts)

  WHAT IT DELIBERATELY DOES NOT REPRODUCE:

  · The garden's grid arithmetic. COLUMNS, PLANT_ZOOM, ART_SHARE, SCATTER,
    GROUND, SWAY_REACH and field() all answer "how do I fit a twelve-column
    lattice into a phone's width", which is not a question a field asks. Plants
    are placed by perspective projection here. Importing that arithmetic would
    only make this look like the app's garden stretched.

  · The knot table. sway.ts samples each plant's loop into SWAY_KNOTS straight
    lines because React Native's Animated.interpolate needs a table to stay on
    the native driver. Canvas has no such constraint, so this evaluates layerAt
    directly every frame — cheaper than the tables at this many plants, with no
    startup cost and no piecewise-linear corners at all. The knots are an
    artifact of the driver, not of the motion. What IS kept per plant is the
    normalising scale, since finding a loop's peak still means sampling it once.

  · Anybody's real garden. The app resolves a species from a session id at
    completion; this weights the twelve species so grass dominates and blooms
    are occasional, which is what a field is and what a plot of 108 is not.

  · anim-lab.html's sway, which is STALE — it still has the superseded
    single-layer wind (SWAY_CYCLES / SWAY_WAVELENGTH / SWAY_GUST, a 5s cycle)
    and the old low-bits phase seed. Copy from src/ui/sway.ts, never the bench.

      open tools/field-demo.html          # no server, no build, no network

  Space pause · T theme · R reseed · [ ] density · H hide the hint

/* --- copied from src/domain/hash.ts. Treat as frozen: the app's plants and
       scatter depend on it answering the same forever. --------------------- */
function hash32(seed) {
  let h = 0x811c9dc5;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

/* --- copied from src/ui/Plant.tsx ---------------------------------------- */
const CANVAS = 48;      // the page every species is drawn on (src/ui/field.ts)
const ROOT_Y = 43;      // the line they all stand on, and the point they pivot about
const ROOT_X = CANVAS / 2;
const PEN_WIDTH = 2.8;  // src/ui/pen.ts, PEN_DOODLE

const CLOSE_ENOUGH = 2;
const COORDINATE = /-?\d*\.?\d+/g;

function closes(subpath) {
  const n = (subpath.match(COORDINATE) || []).map(Number);
  if (n.length < 4) return false;
  return Math.hypot(n[0] - n[n.length - 2], n[1] - n[n.length - 1]) <= CLOSE_ENOUGH;
}

/* A shape closes and takes a paper fill; a stroke does not. Read off the
   drawing rather than recorded beside it, so a redrawn plant comes out right
   without anyone remembering this exists. */
function isShape(d) {
  const subpaths = d.split('M').filter((run) => run.trim());
  return subpaths.length > 0 && subpaths.every(closes);
}

const SWAY_CYCLE_MS = 40000;
const SWAY_LEAN_DEG = 13;
const SWAY_SHAPE = 0.36;
const SWAY_BEND = 0.5;
const SWAY_COHERENCE = 0.88;

const WINDS = [
  { cycles: 16, weight: 1.0, wavelength: 36, direction: 12 },
  { cycles: 11, weight: 0.5, wavelength: 52, direction: 20 },
  { cycles: 7, weight: 0.3, wavelength: 82, direction: 4 },

/* murmur3's finalizer. hash32's last act is `h = (h ^ c) * prime`, so keys
   differing in their last character come out a fixed distance apart — a ramp in
   the top bits, an arithmetic progression in the bottom. Either seeds a phase
   with a travelling wave dressed up as a seed, which is what the phase exists to
   break up. */
function scramble(h) {
  h ^= h >>> 16;
  h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return h >>> 0;
}

/* One seed per plant, shared by every layer — a plant's personal offset is a
   fact about the plant, not three unrelated facts. Summing three independent
   randoms averages the wind straight back out of the field. */
function layerPhase(wind, slot, col, row) {
  const th = (wind.direction * Math.PI) / 180;
  const along = (col * Math.cos(th) + row * Math.sin(th)) / wind.wavelength;
  const own = scramble(hash32('sway-' + slot)) / 4294967296;
  // Negative along the wind, so the crest travels with it rather than against.
  return -SWAY_COHERENCE * along + (1 - SWAY_COHERENCE) * own;
}

/* The warp is a Möbius map of the circle, and the reason is its derivative: the
   Poisson kernel (1 − k²)/(1 − 2k·cos a + k²), strictly positive for every
   k < 1, so however hard the asymmetry is pushed the plant never stands still.
   `sin(a + b·sin a)` does stop dead at a = π, and reads as two twitches. */
function layerAt(wind, phase, p) {
  const k = 0.65 * SWAY_SHAPE;
  const a = 2 * Math.PI * (wind.cycles * p + phase);
  const warped = a + 2 * Math.atan2(k * Math.sin(a), 1 - k * Math.cos(a));
  return wind.weight * Math.sin(warped);
}

/* ---- and the same function, once, as a table ----------------------------
   The frame loop wants this three times per plant, and `atan2` with two `sin`
   and a `cos` around it is the most expensive thing in it — at a few thousand
   plants that is tens of thousands of transcendentals every frame, for a curve
   that is the same shape every time.

   So it is sampled once. The table is built by CALLING the function above at
   unit cycles and zero phase, not by writing the expression out a second time,
   which is what makes it impossible for the two to drift apart. Every layer is
   then this one curve at a different rate, weight and offset — which is what
   `cycles`, `weight` and `phase` already mean.

   2048 steps of a curve whose slope never exceeds about 10 leaves a linear
   interpolation error near a millionth of a degree; the wobble it is driving is
   thirteen degrees. Note this is NOT the app's SWAY_KNOTS: that samples each
   plant's own summed loop and its count is a fidelity setting. This samples the
   one shared waveform underneath all of them, where the count is free. */
const UNIT_WIND = { cycles: 1, weight: 1 };
const WARP_STEPS = 2048;
const WARP = new Float32Array(WARP_STEPS + 1);
for (let i = 0; i <= WARP_STEPS; i++) WARP[i] = layerAt(UNIT_WIND, 0, i / WARP_STEPS);

function warpAt(turns) {
  const x = (turns - Math.floor(turns)) * WARP_STEPS;
  const i = x | 0;
  return WARP[i] + (WARP[i + 1] - WARP[i]) * (x - i);
}

/* --- copied from src/ui/motion.tsx --------------------------------------- */
/* Squash and stretch, not a fade-up: the doodle shoots past full height while
   still pinched narrow, then wobbles to a stop in swings that halve. Every row
   multiplies out to within a few percent of 1, so it changes shape and never
   mass. */
const GROWTH = [
  { at: 0,    opacity: 0, scaleY: 0.05, scaleX: 0.7 },
  { at: 0.12, opacity: 1, scaleY: 1.63, scaleX: 0.64 },
  { at: 0.27, opacity: 1, scaleY: 0.69, scaleX: 1.53 },
  { at: 0.41, opacity: 1, scaleY: 1.16, scaleX: 0.91 },
  { at: 0.56, opacity: 1, scaleY: 0.92, scaleX: 1.14 },
  { at: 0.71, opacity: 1, scaleY: 1.04, scaleX: 1.01 },
  { at: 0.85, opacity: 1, scaleY: 0.98, scaleX: 1.07 },
  { at: 1,    opacity: 1, scaleY: 1,    scaleX: 1 },
];
const SPROUT_MS = 1000;
const BURST_SPREAD_MS = 1600;   // wider than the app's 450: this is a whole field

/* Animated.interpolate on a uniform ramp, clamped at both ends. */
function growthAt(channel, t) {
  if (t <= 0) return GROWTH[0][channel];
  if (t >= 1) return GROWTH[GROWTH.length - 1][channel];
  let i = 0;
  while (i < GROWTH.length - 2 && GROWTH[i + 1].at < t) i++;
  const a = GROWTH[i], b = GROWTH[i + 1];
  return a[channel] + (b[channel] - a[channel]) * ((t - a.at) / (b.at - a.at));
}

/* ===== everything below is the demo's own ================================= */

/* --- the camera ----------------------------------------------------------
   A standing viewer and a flat ground plane. Nothing here is a look: `near` is
   *derived* so the nearest row of plants stands exactly on the bottom edge of
   the window, which is what lets the same numbers hold at any window shape
   instead of needing a pass per screen size. */
const HORIZON = 0.24;          // where the horizon sits, as a fraction of height
const HFOV_DEG = 62;
const EYE_H = 1.5;             // world units; call them metres
const PLANT_WORLD_H = 0.34;    // a plant, root to tip
const FAR_PLANT_PX = 2.2;      // the field stops where a plant would draw smaller
const MARGIN_PX = 100;         // world kept just off-screen, so nothing pops at the edge

/* How far the topmost ink stands above the root it pivots on, in canvas units.
   The drawings rise to about y=5 on the 48-unit page. */
const INK_RISE = ROOT_Y - 5;

/* --- the wind's yardstick ------------------------------------------------
   WINDS measures its wavelengths in the garden's *cells*, so a field has to say
   what a cell is worth in world units. At 0.16 the shortest wave is a shade
   under six metres, which is about what a gust across real grass looks like:
   broad sweeps up close, where you only see part of one, and fine ripples near
   the horizon, where you see a dozen. That compression is the perspective doing
   it, not a second setting. */
const CELL_WORLD = 0.16;

/* --- the lie of the land -------------------------------------------------
   A flat plane reads as a floor, not as country: every row lands on a straight
   line and the far edge comes back ruled, which is the one thing this pen never
   draws. Three sine waves over world position give it a swell instead.

   It costs almost nothing to project, because height enters the same term the
   camera does: a point standing `h` above the reference plane is simply seen
   from `EYE_H - h` rather than from `EYE_H`. Scale is untouched — how big a
   plant looks depends on how far away it is, not on how high it stands.

   Painting order still sorts by depth, never by screen position, so a plant on
   a near ridge covers what is behind it even when the far thing sits lower in
   the frame. That, plus the paper fills, is what makes a ridge read as a ridge.

   The relief is damped to nothing at the camera. You are standing on this
   ground, so the few metres under your feet being flat is what a field actually
   looks like — and it removes the one way terrain could go wrong, which is a
   crest rising between the eye and the bottom of the window and leaving a bald
   patch of paper along the bottom edge. Wavelengths are tens of metres, so what
   you get is a swell rather than a texture; the grass is the texture. */
const TERRAIN_AMP = 0.6;       // world units, peak to reference plane
const TERRAIN_CALM = 2.2;      // how many near-distances the relief fades in over

/* The frequencies are set against how much world is actually in frame, which is
   the thing that is easy to get wrong here: at fifty-metre wavelengths the swell
   was wider than the visible field at every depth, so the ground tilted as one
   piece and read as flat. The visible width at twenty metres is about twenty-
   five, so the leading wave has to be near that to show as a swell at all.
   Three of them, at rates that do not divide into each other, keep it from
   reading as corrugation. */
function ground(x, d) {
  return TERRAIN_AMP * (
    0.55 * Math.sin(x * 0.21 + d * 0.115) +
    0.32 * Math.sin(x * 0.088 - d * 0.18 + 1.7) +
    0.40 * Math.sin(d * 0.072 + 2.3)
  );
}

/* --- haze ----------------------------------------------------------------
   Beer's law rather than a ramp over the field's own depth, because the field's
   far edge is a couple of hundred metres away while nearly every plant is
   inside forty — a linear ramp would leave the whole visible field unhazed. An
   extinction distance is also the one form that keeps looking right when the
   window, and so the depth range, changes.

   This is what makes the horizon dissolve, which is why there is no horizon
   line to draw — just as well, since a ruled line is the one mark this pen
   never makes. */
const HAZE_MAX = 0.9;
const HAZE_DIST = 17;          // world units to fade one e-fold toward paper
const HAZE_BANDS = 32;         // quantised, so a frame sets no colour strings

/* A second axis on the same table: four tones of the one pen, so the field is
   not all struck in a single green. Negative mixes toward ink, positive toward
   paper — both ends are colours the theme already owns, which is what keeps a
   demo from inventing a thirteenth colour the app has no name for. The whole
   product is 4 pens x 4 tones x 32 bands of prebuilt strings, still nothing to
   allocate in a frame. */
const TONES = [-0.16, -0.05, 0.09, 0.22];

/* --- density -------------------------------------------------------------
   Two regimes with a crossover, because one alone is either wrong or ruinous.
   Constant *world* pitch is what a real field has and is what makes the near
   ground read correctly — but it costs plants in proportion to depth squared,
   and carrying it to the horizon here would want about three hundred thousand
   of them. Constant *screen* pitch is affordable everywhere and looks wrong up
   close, where it packs 170px plants 30px apart and every one of them is buried.

   So: `max` of the two. Near, the world term wins and the ground is honest;
   past the crossover (about eight metres at these numbers) the screen term caps
   the count. What the far field loses in density the haze is already taking
   anyway. */
const PITCH_WORLD = 0.195;     // world units between plants, near to
const COL_PX = 30;             // screen px between plants, far away
const ROWS = 92;

/* Grass, with flowers here and there. `plantFor` picks uniformly from the
   twelve, which over a field this size would be one part in six mushrooms. The
   seven foliage species carry it; the five that bloom keep their fixed pen —
   penPink, penOrange, penBlue — which is the app's one licence for a bright.

   They come to about 4% between them, which is a good deal fewer than it
   sounds like it should be. A daisy is a loud orange rosette wider than the
   grass is tall, so it carries several times its share by eye: at the 13% that
   looked right written down, the field came back reading as a flower meadow
   with grass in the gaps. Count is the wrong unit here and the screenshot is
   the right one. */
const WEIGHTS = [
  ['grass', 0.40], ['reed', 0.19], ['sprout', 0.15], ['clover', 0.11],
  ['fern', 0.07], ['sapling', 0.035], ['mushroom', 0.002],
  ['daisy', 0.012], ['poppy', 0.010], ['tulip', 0.008],
  ['thistle', 0.005], ['berry', 0.0045],
];
const PICK = (() => {
  const table = [];
  let acc = 0;
  for (const [key, w] of WEIGHTS) { acc += w; table.push([key, acc]); }
  return table.map(([key, at]) => [key, at / acc]);
})();

function speciesAt(u) {
  for (const [key, at] of PICK) if (u <= at) return key;
  return PICK[PICK.length - 1][0];
}

/* --- state --------------------------------------------------------------- */
const THEME_IDS = ['ink', 'butter', 'prose'];
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d', { alpha: false });

let theme = 0;
let seed = 1;
let density = 0;          // [ and ] step this; each step is ~18% more pitch
let plants = [];
let marks = {};           // species -> [{ path, pen, shape }], Path2D built once
let hazed = {};           // pen -> [colour string per band], so a frame allocates none
let view = { w: 0, h: 0, dpr: 1 };
let windP = 0, lastNow = null, paused = false;
let burstT0 = null;

const color = () => THEMES[THEME_IDS[theme]];

/* Path2D is theme-independent, so this survives a theme change and only the
   colour tables are rebuilt. */
function buildMarks() {
  marks = {};
  for (const key of Object.keys(SPECIES)) {
    const s = SPECIES[key];
    const list = s.growth.map((d) => ({ path: new Path2D(d), pen: 'penGreen', shape: isShape(d) }));
    if (s.bloom) {
      for (const d of s.bloom.paths) {
        list.push({ path: new Path2D(d), pen: s.bloom.pen, shape: isShape(d) });
      }
    }
    marks[key] = list;
  }
}

const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/* One string per pen per haze band. Setting strokeStyle from a table costs
   nothing; building the string would cost an allocation per mark per frame,
   which at this many plants is the whole budget. */
function buildHaze() {
  const c = color();
  const paper = hex(c.paper);
  const ink = hex(c.ink);
  hazed = {};
  for (const pen of ['penGreen', 'penBlue', 'penOrange', 'penPink']) {
    const base = hex(c[pen]);
    const flat = [];
    for (let t = 0; t < TONES.length; t++) {
      const k = TONES[t];
      const toward = k < 0 ? ink : paper;
      const toned = base.map((v, i) => v + (toward[i] - v) * Math.abs(k));
      for (let b = 0; b < HAZE_BANDS; b++) {
        const f = (b / (HAZE_BANDS - 1)) * HAZE_MAX;
        const mix = toned.map((v, i) => Math.round(v + (paper[i] - v) * f));
        flat.push('rgb(' + mix[0] + ',' + mix[1] + ',' + mix[2] + ')');
      }
    }
    hazed[pen] = flat;   // indexed tone * HAZE_BANDS + band
  }
}

/* Everything about where the plants stand. Rebuilt on resize, reseed and a
   density step; never per frame. */
function buildField() {
  const { w: W, h: H } = view;
  const f = (W / 2) / Math.tan((HFOV_DEG * Math.PI) / 360);
  const horizonY = H * HORIZON;

  // Derived, not chosen: the depth at which the ground meets the bottom edge.
  const near = (f * EYE_H) / (H - horizonY);
  const far = (f * PLANT_WORLD_H) / FAR_PLANT_PX;
  const perUnit = PLANT_WORLD_H / INK_RISE;   // world units per canvas unit
  const thin = Math.pow(1.18, density);

  const out = [];
  // Far to near, so the array is already in painting order and a near plant's
  // paper fill covers what stands behind it. That occlusion is most of what
  // makes a field read as deep rather than as transparent.
  for (let r = ROWS - 1; r >= 0; r--) {
    const t = ROWS === 1 ? 0 : r / (ROWS - 1);
    const rowD = near * Math.pow(far / near, t);
    // How thick this row is in depth, so a plant can be jittered within it
    // rather than standing on a line with its neighbours.
    const spanD = rowD * (Math.pow(far / near, 1 / (ROWS - 1)) - 1);

    const pitch = Math.max(PITCH_WORLD, (COL_PX * rowD) / f) * thin;
    const half = ((W / 2 + MARGIN_PX) * rowD) / f;
    const cols = Math.ceil((half * 2) / pitch);
    const brick = (r % 2) * pitch * 0.5;

    for (let c = 0; c <= cols; c++) {
      /* Scrambled before a single bit is read, for the reason sway.ts spells
         out: hash32's last act is `h = (h ^ ch) * prime`, so keys differing in
         their final character come out a fixed distance apart — a near-monotone
         ramp in the top bits, an arithmetic progression in the bottom. The
         column index IS that final character here, so slicing the raw word gave
         each row a species sweep instead of a scatter, and the field came back
         banded: runs of tulips and daisies lying in stripes along the rows,
         which reads as a rendering fault rather than as a meadow. */
      const h = scramble(hash32(seed + '-p-' + r + '-' + c));
      const jx = (((h & 0xff) / 255) * 2 - 1) * 0.42;
      const jd = ((((h >>> 8) & 0xff) / 255) * 2 - 1) * 0.5;
      const u = ((h >>> 16) & 0x7ff) / 2048;
      const v = ((h >>> 27) & 0x1f) / 32;
      const g = scramble(h ^ 0x9e3779b9);
      // Grass is not one height. Without this the field comes back mown, which
      // is the single clearest tell that it was generated rather than grown.
      const grow = 0.70 + ((g & 0xff) / 255) * 0.62;
      const tone = (g >>> 12) & 3;

      const d = rowD + jd * spanD;
      if (d <= near * 0.6) continue;
      const x = -half + brick + (c + jx) * pitch;

      /* Thin patches, so the field is a drawing and not a wall. An even lawn
         at this density fills every gap and the paper stops showing through,
         which loses the one thing the pen is for. Two out-of-step waves over
         world position rather than noise: it costs two trig calls, it is stable
         under reseeding, and at these wavelengths it reads as ground rather
         than as a pattern. */
      const patch = 0.5 + 0.5 * Math.sin(x * 0.42 + Math.cos(d * 0.27) * 2.3);
      if (v > 0.34 + 0.62 * patch) continue;

      const s = (f / d) * perUnit * grow;                // px per canvas unit
      const sx = W / 2 + (f * x) / d;
      // Height enters where the eye does, and nowhere else.
      const gh = ground(x, d) * Math.min(1, (d - near) / (near * TERRAIN_CALM));
      const sy = horizonY + (f * (EYE_H - gh)) / d;

      // The wind is measured in the garden's cells, so world position is
      // converted rather than the field inventing its own coordinates. Doing it
      // from the true world x and depth — not from the row and column indices,
      // whose pitch varies with depth — is what keeps one wind over one field.
      const col = x / CELL_WORLD;
      const row = d / CELL_WORLD;
      const slot = seed * 7919 + out.length;
      const phases = WINDS.map((wind) => layerPhase(wind, slot, col, row));

      out.push({
        sx, sy, s,
        key: speciesAt(u),
        phases,
        scale: normaliser(phases),
        band: tone * HAZE_BANDS + Math.min(HAZE_BANDS - 1,
          Math.round((1 - Math.exp(-(d - near) / HAZE_DIST)) * (HAZE_BANDS - 1))),
        delay: scramble(hash32(seed + '-burst-' + out.length)) % BURST_SPREAD_MS,
      });
    }
  }
  plants = out;
}

/* SWAY_LEAN_DEG is a bound, not a target: three layers rarely crest together,
   so each plant's loop is scaled to peak there exactly. Finding a loop's peak
   means sampling it, which is the one thing the table was still good for — so
   one number per plant is kept and the rest is evaluated live. Sixty-four
   samples finds the peak of a 16-cycle sum to well under a percent, and the
   normalisation only has to be stable, not exact. */
function normaliser(phases) {
  let peak = 0;
  for (let i = 0; i < 64; i++) {
    const p = i / 64;
    let sum = 0;
    for (let w = 0; w < WINDS.length; w++) sum += layerAt(WINDS[w], phases[w], p);
    const a = Math.abs(sum);
    if (a > peak) peak = a;
  }
  return peak > 0 ? SWAY_LEAN_DEG / peak : 0;
}

/* --- drawing -------------------------------------------------------------
   One canvas, one frame loop, Path2D built once per species. anim-lab.html
   gives every plant a <div><svg> and writes style.transform at it, which is
   right for a hundred and eight cells and hopeless for a few thousand: each
   write invalidates an SVG subtree and the browser re-rasterises the lot. */
const RAD = Math.PI / 180;
const MIN_LINE_PX = 0.55;   // below this the far field vanishes and the horizon
                            // reads as bare paper; with it, as fine texture
const DETAIL_PX = 11;       // under this tall, no blooms and no fills — the
                            // occlusion is invisible and it is most of the cost

const C0 = WINDS[0].cycles, W0 = WINDS[0].weight;
const C1 = WINDS[1].cycles, W1 = WINDS[1].weight;
const C2 = WINDS[2].cycles, W2 = WINDS[2].weight;

const stats = { frames: 0, ms: 0 };

/* --- keeping the frame inside its budget ---------------------------------
   The cost here is very largely rasterisation, and rasterisation is paid per
   *device* pixel — so the same window on a retina display is four times the
   work, and a wide one several times again. A fixed density tuned on one
   machine is therefore wrong on every other one, which is exactly how this came
   back feeling like it lagged after measuring fine.

   So it measures itself. `quality` steps the backing store down before it
   touches the field, because resolution is the cheapest thing to give up in a
   drawing made of soft round strokes on paper — and unlike thinning the grass
   it does not change what is on screen. It only ever steps DOWN, and only after
   a run of frames rather than a spike, so it settles instead of hunting. */
const QUALITY = [1, 0.8, 0.65, 0.5];
const FRAME_BUDGET_MS = 9;
const OVER_RUN = 24;            // consecutive slow frames before giving anything up
let quality = 0, overRun = 0;

/* And the same argument made once, up front, rather than only in the governor.
   A retina display asks for four times the pixels of the window it is showing,
   and this is a drawing made of soft round strokes on warm paper: at 1.5 the
   difference from 2 is not findable without a loupe, and it is 44% of the fill.
   Sharpness is what a page like this has to spend, and the strokes are the last
   thing that wants it. */
const DPR_CAP = 1.5;

function draw(now) {
  const c = color();
  const { w: W, h: H, dpr } = view;
  const t0 = performance.now();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = c.paper;
  ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const burstMs = burstT0 === null ? Infinity : now - burstT0;
  const bursting = burstMs < BURST_SPREAD_MS + SPROUT_MS;
  const paper = c.paper;

  for (let i = 0; i < plants.length; i++) {
    const p = plants[i];

    let gx = 1, gy = 1, alpha = 1;
    if (bursting) {
      const t = (burstMs - p.delay) / SPROUT_MS;
      if (t <= 0) continue;
      gx = growthAt('scaleX', t);
      gy = growthAt('scaleY', t);
      alpha = growthAt('opacity', t);
    }

    // The same three layers as layerAt, off the shared table. Unrolled and with
    // the winds' rates hoisted, because this is the one loop that runs a few
    // thousand times a frame.
    const ph = p.phases;
    const lean = p.scale * (
      W0 * warpAt(C0 * windP + ph[0]) +
      W1 * warpAt(C1 * windP + ph[1]) +
      W2 * warpAt(C2 * windP + ph[2])
    );

    /* The composite, multiplied out in JS and handed over in one call.
       Written as the seven calls it stands for —

         setTransform(dpr) · translate(sx,sy) · scale(s) ·
         skewX(-lean·BEND) · rotate(lean·(1-BEND)) · scale(gx,gy) ·
         translate(-ROOT_X,-ROOT_Y)

       — it reads far better and costs seven trips across the canvas boundary
       per plant, which at a few thousand plants a frame is the second largest
       bill in the file after rasterising. The product is six numbers.

       Every step still pivots on the root, because the plant is moved there
       first and back last. The two sway channels are signed against each other
       — skew negative, turn positive — since with the origin at the root the
       ink is at negative y, so a positive shear carries the tip the other way
       from a positive rotation. And the burst scales INSIDE the sway, matching
       Sway-outside-Sprout in the app: a half-grown plant leans half as far in
       pixels at the same angle, where the other order has a squashed plant
       swinging as wide as a full one. */
    const kx = Math.tan(-lean * SWAY_BEND * RAD);
    const th = lean * (1 - SWAY_BEND) * RAD;
    const co = Math.cos(th), si = Math.sin(th);
    const s = p.s;
    const ma = s * (co + kx * si) * gx;
    const mb = s * si * gx;
    const mc = s * (kx * co - si) * gy;
    const md = s * co * gy;
    ctx.setTransform(
      dpr * ma, dpr * mb, dpr * mc, dpr * md,
      dpr * (ma * -ROOT_X + mc * -ROOT_Y + p.sx),
      dpr * (mb * -ROOT_X + md * -ROOT_Y + p.sy)
    );

    // lineWidth is in the transform's units, so 2.8 already grows with the
    // drawing exactly as it does in SVG. The floor is in device pixels.
    ctx.lineWidth = Math.max(PEN_WIDTH, MIN_LINE_PX / (s * dpr));
    ctx.globalAlpha = alpha;

    const detail = s * INK_RISE >= DETAIL_PX;
    const list = marks[p.key];
    for (let m = 0; m < list.length; m++) {
      const mark = list[m];
      if (!detail) {
        if (mark.pen !== 'penGreen') continue;
      } else if (mark.shape) {
        ctx.fillStyle = paper;
        ctx.fill(mark.path);
      }
      ctx.strokeStyle = hazed[mark.pen][p.band];
      ctx.stroke(mark.path);
    }
  }

  ctx.globalAlpha = 1;
  stats.frames++;
  stats.ms += performance.now() - t0;
}

function tick(now) {
  requestAnimationFrame(tick);
  // Advanced rather than derived from `now`, so pausing and resuming does not
  // teleport the field to a new phase.
  if (lastNow !== null && !paused) windP = (windP + (now - lastNow) / SWAY_CYCLE_MS) % 1;
  lastNow = now;

  const before = stats.ms;
  draw(now);
  govern(stats.ms - before, now);
}

/* Ignore the burst, which is not representative — plants are still arriving and
   the first frames carry the page's own warm-up. */
function govern(ms, now) {
  if (burstT0 !== null && now - burstT0 < BURST_SPREAD_MS + SPROUT_MS + 400) return;
  if (ms <= FRAME_BUDGET_MS) { overRun = 0; return; }
  if (++overRun < OVER_RUN) return;
  overRun = 0;
  if (quality < QUALITY.length - 1) { quality++; resize(); }
  else if (density < 8) { density++; buildField(); }
}

/* --- chrome, such as it is ----------------------------------------------- */
const hint = document.getElementById('hint');

function applyTheme() {
  const c = color();
  buildHaze();
  document.documentElement.style.background = c.paper;
  hint.style.color = c.inkFaint;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP) * QUALITY[quality];
  view = { w: window.innerWidth, h: window.innerHeight, dpr };
  canvas.width = Math.round(view.w * dpr);
  canvas.height = Math.round(view.h * dpr);
  buildField();
}

addEventListener('resize', resize);

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  else if (k === 't') { theme = (theme + 1) % THEME_IDS.length; applyTheme(); }
  else if (k === 'r') { seed++; buildField(); burstT0 = performance.now(); }
  else if (k === '[') { density = Math.min(8, density + 1); buildField(); }
  else if (k === ']') { density = Math.max(-3, density - 1); buildField(); }
  else if (k === 'h') { hint.classList.toggle('gone'); return; }
  else return;
  hint.classList.add('gone');
});

buildMarks();
applyTheme();
resize();
burstT0 = performance.now();
requestAnimationFrame(tick);
setTimeout(() => hint.classList.add('gone'), 7000);

/* Read by the screenshot harness to check the field is affordable, and handy
   from a console when tuning density. */
window.__field = {
  stats,
  count: () => plants.length,
  quality: () => ({ step: quality, dpr: view.dpr, density }),
  frameMs: () => (stats.frames ? stats.ms / stats.frames : 0),
  reset: () => { stats.frames = 0; stats.ms = 0; },
  leanOf: (i) => {
    const p = plants[i];
    let sum = 0;
    for (let w = 0; w < 3; w++) sum += layerAt(WINDS[w], p.phases[w], windP);
    return sum * p.scale;
  },
};
</script>
